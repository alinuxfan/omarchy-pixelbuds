[package]
name = "pixelbudsctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Control client for pixelbudsd, the Pixel Buds Pro Omarchy panel daemon"

[[bin]]
name = "pixelbudsctl"
path = "src/main.rs"

[dependencies]
pixelbuds-common = { path = "../pixelbuds-common" }
anyhow = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "time"] }
